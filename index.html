<script>
const PREF_KEY='yellow-diary-preferences-v1';
const defaultPrefs={theme:'butter',hidden:[],order:['home','calendar','reviewCalendar','tasks','books','report','stats','study','journal','money','settings'],homeCards:{tasks:true,events:true,books:true},readingGoal:100,studyGoal:60,chartStyle:'bar',chartPalette:'pastel',chartPercent:true,chartCount:true,appName:'노란 기록장',receiptBrand:'YELLOW READING CLUB',platformOptions:['밀리의서재','리디북스','종이책','셀렉트','전자도서관','도서관'],genreOptions:['소설','에세이','시','인문','철학','사회','역사','경제','경영','자기계발','과학','예술','기타']};
let prefs={...defaultPrefs,...JSON.parse(localStorage.getItem(PREF_KEY)||'{}')};
prefs.homeCards={...defaultPrefs.homeCards,...(prefs.homeCards||{})};
// 독서 탭은 항상 표시합니다.
prefs.hidden=(prefs.hidden||[]).filter(k=>k!=='books');
function savePrefs(){localStorage.setItem(PREF_KEY,JSON.stringify(prefs));applyPrefs();render()}
function applyPrefs(){document.documentElement.dataset.theme=prefs.theme;document.title=prefs.appName||'노란 기록장';let logo=document.querySelector('.logo');if(logo)logo.firstChild.textContent='🌼 '+(prefs.appName||'노란 기록장');}

const optionPalette=['#ffe2a1','#b8dffb','#e5cafa','#d4f2bd','#b9e9ec','#ffccc6','#e9dfc8','#cbd6f7'];
function optionsFor(kind){let key=kind==='genre'?'genreOptions':'platformOptions';let defaults=defaultPrefs[key];let stored=Array.isArray(prefs[key])?prefs[key]:defaults;let existing=data.books.map(b=>String(b[kind]||'').trim()).filter(Boolean);return [...new Set([...stored,...existing])]}
function choiceField(label,name,value){let opts=optionsFor(name);return `<label class="field span2">${label}<input name="${name}" list="${name}ChoiceList" value="${attr(value||'')}" placeholder="목록에서 선택하거나 직접 입력" autocomplete="off"><datalist id="${name}ChoiceList">${opts.map(v=>`<option value="${attr(v)}"></option>`).join('')}</datalist><span class="choice-pills">${opts.map((v,i)=>`<button type="button" class="choice-pill" style="background:${optionPalette[i%optionPalette.length]}" onclick="this.closest('.field').querySelector('input').value=${JSON.stringify(v).replace(/"/g,'&quot;')}">${esc(v)}</button>`).join('')}</span></label>`}
function manageChoice(kind,action,index){let key=kind==='genre'?'genreOptions':'platformOptions',list=[...(prefs[key]||defaultPrefs[key])],old=list[index];if(action==='add'){let val=prompt('추가할 '+(kind==='genre'?'장르':'독서 방식·이용처')+' 이름을 입력해 주세요.');if(val===null)return;val=val.trim();if(!val)return;if(list.includes(val)){alert('이미 등록된 항목입니다.');return}list.push(val)}
else if(action==='rename'){if(old===undefined)return;let val=prompt('변경할 이름',old);if(val===null)return;val=val.trim();if(!val||val===old)return;if(list.includes(val)){alert('이미 등록된 항목입니다.');return}list[index]=val;let count=0;for(let b of data.books){if(String(b[kind]||'').trim()===old){b[kind]=val;count++}}if(count)save()}
else if(action==='delete'){if(old===undefined)return;let used=data.books.filter(b=>String(b[kind]||'').trim()===old).length;if(!confirm(`'${old}' 선택지를 삭제할까요?${used?'\\n이미 등록된 '+used+'권의 기록은 그대로 유지됩니다.':''}`))return;list.splice(index,1)}
prefs[key]=list;savePrefs()}
function choiceSettings(kind,label){let key=kind==='genre'?'genreOptions':'platformOptions',list=prefs[key]||defaultPrefs[key];return `<div class="panel"><h2>${esc(label)} 선택지 관리</h2><p class="muted">추가·이름 변경·삭제할 수 있습니다. 이름 변경 시 기존 책 기록에도 반영됩니다. 삭제는 기존 책 기록을 지우지 않습니다.</p><div class="choice-manager">${list.map((v,i)=>`<div class="choice-manage-item"><span class="choice-pill" style="background:${optionPalette[i%optionPalette.length]}">${esc(v)}</span><span class="actions"><button class="btn secondary" onclick="manageChoice('${kind}','rename',${i})">수정</button><button class="btn secondary" onclick="manageChoice('${kind}','delete',${i})">삭제</button></span></div>`).join('')}</div><button class="btn" onclick="manageChoice('${kind}','add',-1)">+ ${esc(label)} 추가</button></div>`}
function setPref(name,value){prefs[name]=value;savePrefs()}
function setCard(name,checked){prefs.homeCards[name]=checked;savePrefs()}
function toggleMenu(name,checked){prefs.hidden=name==='books'?prefs.hidden:(checked?prefs.hidden.filter(x=>x!==name):[...new Set([...prefs.hidden,name])]);savePrefs()}
function moveMenu(name,direction){let a=[...prefs.order],i=a.indexOf(name),j=i+direction;if(i<0||j<0||j>=a.length||a[j]==='settings'||name==='settings')return;[a[i],a[j]]=[a[j],a[i]];prefs.order=a;savePrefs()}
function resetPrefs(){if(confirm('화면 설정만 초기화할까요? 작성한 기록은 유지됩니다.')){prefs=structuredClone(defaultPrefs);savePrefs()}}

function csvRows(text){let rows=[],row=[],field='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);rows.push(row);row=[];field=''}else field+=c}row.push(field);rows.push(row);return rows}

async function loadBooksFile(input){let file=input.files?.[0];input.value='';if(!file)return;try{let groups=[];if(/\.csv$/i.test(file.name)){let buffer=await file.arrayBuffer(),txt;try{txt=new TextDecoder('utf-8',{fatal:true}).decode(buffer)}catch(e){txt=new TextDecoder('euc-kr').decode(buffer)}groups=[{name:'CSV',rows:csvRows(txt.replace(/^\ufeff/,''))}]}else{if(typeof XLSX==='undefined')throw Error('엑셀 읽기 기능을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');let wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:false});let reading=wb.SheetNames.filter(n=>/^20\d{2}\s*독서$/.test(n.trim()));let metadata=wb.SheetNames.filter(n=>/도서정보|책정보|표지정보|도서검색결과|메타데이터/.test(n));let names=reading.length?reading:wb.SheetNames.filter(n=>n!=='서평단'&&n!=='진도율'&&n!=='책');if(!names.length)throw Error('연도별 독서 시트를 찾지 못했습니다.');groups=names.map(name=>({name,rows:XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:'',raw:true})}))}let counts=[];pendingBookImport=[];for(let g of groups){try{let items=parseBookRows(g.rows);items.forEach((b,i)=>{b.sourceKey=g.name+'|'+i});pendingBookImport.push(...items);counts.push(g.name+' '+items.length+'권')}catch(e){counts.push(g.name+' 0권')}}if(!pendingBookImport.length)throw Error('책 제목이 있는 기록을 찾지 못했습니다.');let known=new Set(data.books.map(b=>normBook(b.title)+'|'+(b.finish||b.start||'')));let duplicates=pendingBookImport.filter(b=>known.has(normBook(b.title)+'|'+(b.finish||b.start||''))).length;document.getElementById('modalTitle').textContent='📚 독서 기록 가져오기 확인';document.getElementById('modalBody').innerHTML=`<p><strong>${esc(file.name)}</strong> · ${pendingBookImport.length}권 확인</p><p class="muted">시트별: ${esc(counts.join(' / '))}</p><p class="muted">연도별 시트의 각 행을 독립적인 독서 기록으로 보관합니다. 같은 제목이어도 독서 기록을 합치지 않습니다. 기존 기록은 제목·시작일·완독일이 모두 같을 때만 연결합니다. 저자·페이지 수는 필수가 아닙니다. 표지는 독서 목록에서 이미지 파일을 직접 선택해 올릴 수 있습니다. 페이지 수를 비워두면 1/1로 등록합니다.</p><div style="max-height:240px;overflow:auto">${pendingBookImport.slice(0,30).map(b=>`<div class="item"><strong>${esc(b.title)}</strong><span class="tiny">${esc(b.finish||b.start||'날짜 없음')} · ${esc(b.status)}</span></div>`).join('')}</div><div class="actions" style="margin-top:14px"><button class="btn" onclick="confirmBooksImport()">기록 가져오기</button><button class="btn secondary" onclick="modal.close()">취소</button></div>`;modal.showModal()}catch(e){alert('가져오지 못했습니다. '+e.message)}}
function confirmBooksImport(){
 // Preserve each source row as a separate reading record. Never collapse by title.
 let added=0,updated=0;let seen=new Set(data.books.map(b=>b.sourceKey).filter(Boolean));
 let existing=data.books.filter(b=>!b.sourceKey);
 let claimed=new Set();
 for(let b of pendingBookImport){
   let key=b.sourceKey||'';
   if(key&&seen.has(key))continue;
   let candidate=existing.find(x=>!claimed.has(x.id)&&normBook(x.title)===normBook(b.title)&&
     (x.finish||'')===(b.finish||'')&&(x.start||'')===(b.start||''));
   if(candidate){
     claimed.add(candidate.id);
     if(key)candidate.sourceKey=key;
     for(let k of ['author','total'])if(!candidate[k]&&b[k])candidate[k]=b[k];
     updated++;
   }else{data.books.push({id:id(),...b});added++}
   if(key)seen.add(key);
 }
 save();pendingBookImport=[];modal.close();go('books');
 alert(`가져오기 완료\n새 기록 ${added}권 · 기존 기록과 연결 ${updated}권\n현재 전체 ${data.books.length}권\n\n같은 제목의 책도 서로 다른 독서 기록이면 각각 보관합니다.`);
}

function readingNow(){let arr=data.books.filter(b=>b.status==='읽는 중');return `<div class="panel"><div class="kpi"><h2>☑ 읽고 있는 책 체크리스트</h2><button class="btn" onclick="editBook()">+ 책 추가</button></div><p class="muted">현재 페이지를 수정하거나 완독을 체크하면 독서 목록과 통계에 반영됩니다.</p>${arr.map(b=>{let n=Number(b.total)||0,p=Math.min(100,Math.round(Number(b.page||0)/Math.max(1,n)*100));return `<div class="reading-check"><label><input type="checkbox" onchange="markReadDone('${b.id}',this.checked)"> 완독</label><div class="reading-check-main"><strong>${esc(b.title)}</strong><small>${esc(b.author||'')} · ${p}%</small><div class="progress"><div style="width:${p}%"></div></div></div><label class="reading-page">현재 쪽<input type="number" min="0" max="${n||999999}" value="${Number(b.page)||0}" onchange="setReadingPage('${b.id}',this.value)"></label><span class="muted">/ ${n||'?'}쪽</span><button class="btn secondary" onclick="editBook('${b.id}')">상세</button></div>`}).join('')||'<p class="muted">읽는 중인 책이 없습니다. 독서 탭에서 책 상태를 ‘읽는 중’으로 설정해 주세요.</p>'}</div>`}
function setReadingPage(bid,value){let b=data.books.find(x=>x.id===bid);if(!b)return;let n=Math.max(0,Number(value)||0);if(Number(b.total)>0)n=Math.min(n,Number(b.total));b.page=n;save();render()}
function markReadDone(bid,checked){if(!checked)return;let b=data.books.find(x=>x.id===bid);if(!b)return;b.status='완독';b.finish=b.finish||iso(new Date());if(Number(b.total)>0)b.page=b.total;save();render()}
function recapBooks(){return booksFiltered({...reportFilter,status:'완독'})}
function report(){let arr=recapBooks(),n=arr.length,period=[reportFilter.year==='all'?'전체 연도':reportFilter.year+'년',reportFilter.quarter==='all'?'':reportFilter.quarter+'분기',reportFilter.month==='all'?'':reportFilter.month+'월'].filter(Boolean).join(' ');return `<div class="panel"><h2>🖼 독서 결산 만들기</h2><p class="muted">목록형·표지형을 선택하고, 4:5 인스타그램 피드 이미지 여러 장으로 저장할 수 있습니다.</p>${filterControl('report',reportFilter)}<div class="actions" style="margin-top:12px"><label>결산 형태 <select onchange="setPref('reportLayout',this.value)"><option value="cover" ${prefs.reportLayout==='cover'?'selected':''}>표지형</option><option value="list" ${prefs.reportLayout==='list'?'selected':''}>목록형</option></select></label><button class="btn" onclick="downloadReport()">🖼 결산 이미지 여러 장 저장</button><button class="btn secondary" onclick="window.print()">인쇄 / PDF</button></div><p class="muted">이미지는 장별로 PNG 파일이 다운로드됩니다. 표지·저자·페이지 표시 여부는 설정에서 변경할 수 있습니다.</p></div><div class="report" id="reportArea"><div class="muted" style="letter-spacing:3px;text-align:center">MY READING ARCHIVE</div><h1 style="text-align:center;margin:10px 0">${esc(period)} ${esc(prefs.reportTitle||'독서 결산')}</h1><p style="text-align:center;color:#907a4d">완독 ${n}권 · 나만의 독서 기록</p><div class="${prefs.reportLayout==='list'?'recap-list':'reportbooks'}">${arr.map(b=>`<div class="${prefs.reportLayout==='list'?'recap-list-item':'reportbook'}">${prefs.reportShowCover?(b.cover?`<img src="${attr(b.cover)}" alt="">`:'<div class="cover-empty">📖</div>'):''}<div><strong>${esc(b.title)}</strong>${prefs.reportShowAuthor?`<small>${esc(b.author||'저자 미상')}</small>`:''}${prefs.reportShowPages?`<small>${Number(b.total)>0?Number(b.total)+'쪽':'페이지 미입력'}</small>`:''}</div></div>`).join('')}</div>${!n?'<p style="text-align:center">이 기간에 완독한 책이 없습니다.</p>':''}</div>`}

function receiptBookOptions(){return receiptBooksAll().filter(b=>(receiptYear==='all'||receiptBookYear(b)===receiptYear)&&(!receiptSearch||String(b.title||'').toLowerCase().includes(receiptSearch.toLowerCase())||String(b.author||'').toLowerCase().includes(receiptSearch.toLowerCase())))}
function refreshReceiptBookOptions(){let sel=document.getElementById('receiptBookSelect');if(!sel)return;let arr=receiptBookOptions();sel.innerHTML=arr.length?arr.map(b=>`<option value="${attr(b.id)}" ${b.id===receiptBookId?'selected':''}>${esc(b.title)}${b.author?' · '+esc(b.author):''}</option>`).join(''):'<option value="">검색 결과가 없습니다</option>';let info=document.getElementById('receiptSearchCount');if(info)info.textContent=`${arr.length}권 검색됨`;if(!arr.some(b=>b.id===receiptBookId))receiptBookId=arr[0]?.id||'';renderReceiptPreviewOnly()}
function renderReceiptPreviewOnly(){let box=document.getElementById('receiptPreviewContainer');if(!box)return;let b=receiptBookOptions().find(x=>x.id===receiptBookId);box.innerHTML=b?receiptPaper(b):'<div class="panel"><p class="muted">검색 결과에 책이 없습니다. 연도나 검색어를 변경해 주세요.</p></div>';let btn=document.getElementById('receiptDownloadButton');if(btn)btn.disabled=!b}
function receiptPaper(b){let colors=({yellow:['#fff8e4','#d4a62f'],cream:['#fffdf5','#9d8563'],pink:['#fff0ef','#cc9295'],sage:['#f2f8ee','#7f9c80'],mono:['#ffffff','#333333']})[prefs.receiptColor]||['#fff8e4','#d4a62f'];let title=receiptCustomTitle||prefs.receiptTitle||'독서 영수증';return `<div class="receipt-wrap" style="background:${colors[1]}22"><div id="receiptPreview" class="receipt-paper" style="background:${colors[0]};border-top:7px solid ${colors[1]};--receipt-accent:${colors[1]}"><div class="receipt-top">${esc(prefs.receiptBrand??'YELLOW READING CLUB')}</div><h2 id="receiptPreviewTitle">${esc(title)}</h2><div class="receipt-dash"></div>${prefs.receiptShowCover&&b.cover?`<img class="receipt-cover" src="${attr(b.cover)}">`:''}<div class="receipt-caption">BOOK TITLE</div><h3>${esc(b.title)}</h3>${prefs.receiptShowAuthor?`<div class="receipt-line"><span>AUTHOR</span><span>${esc(b.author||'저자 미상')}</span></div>`:''}<div class="receipt-line"><span>STATUS</span><span>${esc(b.status||'')}</span></div>${prefs.receiptShowDates?`<div class="receipt-line"><span>START / FINISH</span><span>${esc(b.start||'-')} / ${esc(b.finish||'-')}</span></div>`:''}${prefs.receiptShowPages?`<div class="receipt-line"><span>PAGES</span><span>${Number(b.page)||0} / ${Number(b.total)||'?'} P</span></div>`:''}${prefs.receiptShowProgress?`<div class="receipt-line"><span>PROGRESS</span><span>${Number(b.total)>0?Math.round(Math.min(100,Number(b.page||0)/Number(b.total)*100)):0}%</span></div><div class="progress"><div style="width:${Number(b.total)>0?Math.min(100,Number(b.page||0)/Number(b.total)*100):0}%"></div></div>`:''}<div class="receipt-dash"></div><div class="receipt-end">${esc(prefs.receiptFooter||'')}</div><div class="receipt-barcode">|||| ||| |||||| || ||||| ||| ||||||</div></div></div>`}
function receipt(){let all=receiptBooksAll(),years=[...new Set(all.map(receiptBookYear))].sort((a,b)=>b.localeCompare(a)),books=receiptBookOptions();if(!books.some(b=>b.id===receiptBookId))receiptBookId=books[0]?.id||'';let b=books.find(x=>x.id===receiptBookId);let title=receiptCustomTitle||prefs.receiptTitle||'독서 영수증';return `<div class="panel"><h2>🧾 독서 인증 영수증</h2><p class="muted">독서 탭의 전체 책 목록에서 연도를 선택하거나 제목·저자를 검색해 한 권을 고르세요. 독서결산 필터와는 별개입니다.</p><div class="formgrid"><label class="field">독서 연도<select onchange="receiptYear=this.value;receiptBookId='';render()"><option value="all" ${receiptYear==='all'?'selected':''}>전체 연도</option>${years.map(y=>`<option value="${attr(y)}" ${receiptYear===y?'selected':''}>${y==='undated'?'날짜 미등록':y+'년'}</option>`).join('')}</select></label><label class="field">책 제목 또는 저자 검색<input id="receiptBookSearch" type="search" placeholder="책 제목이나 저자 입력" value="${attr(receiptSearch)}" oninput="receiptSearch=this.value;refreshReceiptBookOptions()"></label><label class="field">책 선택 <small id="receiptSearchCount">${books.length}권 검색됨</small><select id="receiptBookSelect" onchange="receiptBookId=this.value;renderReceiptPreviewOnly()">${books.length?books.map(x=>`<option value="${attr(x.id)}" ${x.id===receiptBookId?'selected':''}>${esc(x.title)}${x.author?' · '+esc(x.author):''}</option>`).join(''):'<option value="">검색 결과가 없습니다</option>'}</select></label><label class="field">표지 이미지 표시<label style="display:flex;align-items:center;gap:8px;margin-top:8px"><input type="checkbox" ${prefs.receiptShowCover?'checked':''} onchange="setPref('receiptShowCover',this.checked);renderReceiptPreviewOnly()" style="width:auto"> 책 제목 위에 표지 이미지 넣기</label></label><label class="field">이번 영수증 제목<input value="${attr(title)}" oninput="receiptCustomTitle=this.value;updateReceiptPreview()"></label><label class="field">이미지 형태<select onchange="setPref('receiptSize',this.value);render()"><option value="receipt" ${prefs.receiptSize==='receipt'?'selected':''}>긴 영수증형</option><option value="feed" ${prefs.receiptSize==='feed'?'selected':''}>인스타그램 피드형 (4:5)</option></select></label><label class="field">색상<select onchange="setPref('receiptColor',this.value);render()">${[['yellow','노란색'],['cream','아이보리'],['pink','연분홍'],['sage','연두'],['mono','흑백']].map(([v,l])=>`<option value="${v}" ${prefs.receiptColor===v?'selected':''}>${l}</option>`).join('')}</select></label></div><div class="actions" style="margin-top:12px"><button id="receiptDownloadButton" class="btn" onclick="downloadReceipt()" ${b?'':'disabled'}>🧾 영수증 PNG 저장</button><button class="btn secondary" onclick="receiptCustomTitle='';render()">제목 기본값으로</button></div></div><div id="receiptPreviewContainer">${b?receiptPaper(b):'<div class="panel"><p class="muted">검색 결과에 책이 없습니다. 연도나 검색어를 변경해 주세요.</p></div>'}</div>`}

function updateReceiptPreview(){let e=document.getElementById('receiptPreviewTitle');if(e)e.textContent=receiptCustomTitle||prefs.receiptTitle||'독서 영수증'}
function canvasLines(ctx,text,x,y,maxWidth,lineHeight,maxLines=3){let chars=Array.from(String(text||'')),line='',lines=[];for(let ch of chars){if(ctx.measureText(line+ch).width>maxWidth&&line){lines.push(line);line=ch}else line+=ch}if(line)lines.push(line);for(let i=0;i<Math.min(maxLines,lines.length);i++)ctx.fillText(lines[i],x,y+i*lineHeight);return Math.min(maxLines,lines.length)*lineHeight}
async function coverImage(src){if(!src)return null;return new Promise(resolve=>{let img=new Image();img.onload=()=>resolve(img);img.onerror=()=>resolve(null);img.src=src;setTimeout(()=>resolve(null),4000)})}
function paintCover(ctx,img,x,y,w,h){if(!img)return;let scale=Math.min(w/img.width,h/img.height),iw=img.width*scale,ih=img.height*scale;ctx.drawImage(img,x+(w-iw)/2,y+(h-ih)/2,iw,ih)}
async function downloadReport(){let arr=recapBooks(),isList=prefs.reportLayout==='list',perPage=isList?16:12,w=1080,h=1350,pagesCount=Math.max(1,Math.ceil(arr.length/perPage));for(let page=0;page<pagesCount;page++){let cv=document.createElement('canvas');cv.width=w;cv.height=h;let c=cv.getContext('2d');c.fillStyle='#fffaf0';c.fillRect(0,0,w,h);c.textAlign='center';c.fillStyle='#8b7548';c.font='24px sans-serif';c.fillText('MY READING ARCHIVE',w/2,70);c.fillStyle='#3b342a';c.font='bold 42px sans-serif';c.fillText((prefs.reportTitle||'독서 결산').slice(0,24),w/2,133);c.font='23px sans-serif';c.fillText(`완독 ${arr.length}권 · ${page+1}/${pagesCount}`,w/2,178);let slice=arr.slice(page*perPage,(page+1)*perPage);for(let i=0;i<slice.length;i++){let b=slice[i];if(isList){let y=220+i*66;c.textAlign='left';c.fillStyle='#f5edda';c.fillRect(45,y,990,60);let x=68;if(prefs.reportShowCover){let im=await coverImage(b.cover);if(im)paintCover(c,im,x,y+4,38,52);else{c.fillStyle='#9a896c';c.font='18px sans-serif';c.fillText('📖',x,y+35)}x+=62}c.fillStyle='#3b342a';c.font='bold 21px sans-serif';c.fillText((b.title||'').slice(0,34),x,y+27);c.font='17px sans-serif';c.fillStyle='#8b7a61';let detail=[prefs.reportShowAuthor?(b.author||'저자 미상'):'',prefs.reportShowPages?(b.total?b.total+'쪽':'페이지 미입력'):''].filter(Boolean).join(' · ');c.fillText(detail.slice(0,45),x,y+49)}else{let col=i%3,row=Math.floor(i/3),x=95+col*330,y=225+row*275;c.textAlign='center';let im=prefs.reportShowCover?await coverImage(b.cover):null;if(prefs.reportShowCover){if(im)paintCover(c,im,x+70,y,160,190);else{c.fillStyle='#eadfcb';c.fillRect(x+70,y,160,190);c.fillStyle='#87785d';c.font='20px sans-serif';c.fillText('표지 없음',x+150,y+105)}}c.fillStyle='#3b342a';c.font='bold 19px sans-serif';c.fillText((b.title||'').slice(0,20),x+150,y+(prefs.reportShowCover?216:60));c.fillStyle='#8b7a61';c.font='16px sans-serif';let detail=[prefs.reportShowAuthor?(b.author||''):'',prefs.reportShowPages?(b.total?b.total+'쪽':''):''].filter(Boolean).join(' · ');c.fillText(detail.slice(0,28),x+150,y+(prefs.reportShowCover?240:88))}}c.fillStyle='#a18d68';c.textAlign='center';c.font='18px sans-serif';c.fillText('노란 기록장 · '+(page+1)+' / '+pagesCount,w/2,1310);let blob=await new Promise(r=>cv.toBlob(r,'image/png'));if(blob)downloadBlob(blob,`독서결산_${String(page+1).padStart(2,'0')}.png`);await new Promise(r=>setTimeout(r,180))}}
async function downloadReceipt(){let b=data.books.find(x=>x.id===receiptBookId);if(!b)return;let feed=prefs.receiptSize==='feed',w=900,h=feed?1125:1450,cv=document.createElement('canvas');cv.width=w;cv.height=h;let c=cv.getContext('2d'),pal=({yellow:['#fff8e4','#d4a62f'],cream:['#fffdf5','#9d8563'],pink:['#fff0ef','#cc9295'],sage:['#f2f8ee','#7f9c80'],mono:['#fff','#333']})[prefs.receiptColor]||['#fff8e4','#d4a62f'];c.fillStyle=pal[0];c.fillRect(0,0,w,h);c.textAlign='center';c.fillStyle='#6e6355';c.font='22px monospace';c.fillText(String(prefs.receiptBrand??'YELLOW READING CLUB').slice(0,55),450,82);c.fillStyle='#302c27';c.font='bold 45px sans-serif';canvasLines(c,receiptCustomTitle||prefs.receiptTitle||'독서 영수증',450,160,750,55,2);c.strokeStyle=pal[1];c.setLineDash([10,9]);c.beginPath();c.moveTo(80,225);c.lineTo(820,225);c.stroke();c.setLineDash([]);let y=275;if(prefs.receiptShowCover&&b.cover){let im=await coverImage(b.cover);if(im){paintCover(c,im,feed?365:340,y,feed?170:220,feed?210:260);y+=feed?230:285}}c.fillStyle='#82715e';c.font='20px monospace';c.fillText('BOOK TITLE',450,y);y+=55;c.fillStyle='#302c27';c.font='bold 36px sans-serif';y+=canvasLines(c,b.title,450,y,740,48,3)+35;let rows=[];if(prefs.receiptShowAuthor)rows.push(['AUTHOR',b.author||'저자 미상']);rows.push(['STATUS',b.status||'-']);if(prefs.receiptShowDates)rows.push(['DATE',(b.start||'-')+' / '+(b.finish||'-')]);if(prefs.receiptShowPages)rows.push(['PAGES',`${Number(b.page)||0} / ${Number(b.total)||'?'} P`]);if(prefs.receiptShowProgress)rows.push(['PROGRESS',Number(b.total)>0?Math.round(Math.min(100,Number(b.page||0)/Number(b.total)*100))+'%':'0%']);for(let [k,v] of rows){c.textAlign='left';c.font='21px monospace';c.fillStyle='#82715e';c.fillText(k,95,y);c.textAlign='right';c.fillStyle='#302c27';c.fillText(String(v).slice(0,37),805,y);y+=57}if(prefs.receiptShowProgress){let ratio=Number(b.total)>0?Math.min(1,Number(b.page||0)/Number(b.total)):0;c.fillStyle='#e6ddca';c.fillRect(95,y,710,15);c.fillStyle=pal[1];c.fillRect(95,y,710*ratio,15);y+=60}let bottom=Math.min(h-155,Math.max(y+65,h-180));c.strokeStyle=pal[1];c.setLineDash([10,9]);c.beginPath();c.moveTo(80,bottom-45);c.lineTo(820,bottom-45);c.stroke();c.setLineDash([]);c.textAlign='center';c.fillStyle='#51483d';c.font='22px sans-serif';canvasLines(c,prefs.receiptFooter||'',450,bottom,740,30,2);c.font='35px monospace';c.fillText('||| |||| || |||||| ||| |||| ||',450,h-65);let blob=await new Promise(r=>cv.toBlob(r,'image/png'));if(blob)downloadBlob(blob,`독서영수증_${(b.title||'책').replace(/[\\/:*?"<>|]/g,'').slice(0,24)}.png`)}


let coverLibrarySearch='',coverLibraryItems=[],coverLibraryUrls=new Map(),coverLibrarySelected='';
function libraryDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open('yellow-reading-cover-library',1);r.onupgradeneeded=()=>r.result.createObjectStore('images',{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function libraryAll(){let db=await libraryDB();return new Promise((resolve,reject)=>{let r=db.transaction('images','readonly').objectStore('images').getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)})}
async function libraryPut(item){let db=await libraryDB();return new Promise((resolve,reject)=>{let tx=db.transaction('images','readwrite');tx.objectStore('images').put(item);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function libraryDelete(id){let db=await libraryDB();return new Promise((resolve,reject)=>{let tx=db.transaction('images','readwrite');tx.objectStore('images').delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function libraryUrl(item){if(!coverLibraryUrls.has(item.id))coverLibraryUrls.set(item.id,URL.createObjectURL(item.blob));return coverLibraryUrls.get(item.id)}
async function restoreLibraryCovers(){try{coverLibraryItems=await libraryAll();for(let b of data.books){if(b.coverLibraryId){let item=coverLibraryItems.find(x=>x.id===b.coverLibraryId);if(item)b.cover=libraryUrl(item)}}render()}catch(e){console.warn('표지 보관함 불러오기 실패',e)}}
async function uploadCoverLibrary(input){let files=[...(input.files||[])].filter(f=>f.type.startsWith('image/'));input.value='';if(!files.length)return;let added=0;for(let f of files){if(f.size>12*1024*1024)continue;let item={id:'lib_'+Date.now()+'_'+Math.random().toString(36).slice(2),name:f.name.replace(/\.[^.]+$/,''),blob:f,created:Date.now()};await libraryPut(item);coverLibraryItems.push(item);added++}openCoverLibrary();alert(added+'개의 표지를 보관함에 저장했습니다.')} 
function coverLibraryView(){let books=data.books.filter(b=>[b.title,b.author].some(x=>String(x||'').toLowerCase().includes(coverLibrarySearch.toLowerCase())));let images=coverLibraryItems.filter(x=>x.name.toLowerCase().includes(coverLibrarySearch.toLowerCase()));return `<div class="panel"><h2>🖼 공용 책 표지 보관함</h2><p class="muted">이미지를 여러 장 등록하고, 독서 탭의 책에 연결하면 나의 책장·독서결산·영수증에서 같은 표지를 사용합니다. 표지는 이 브라우저의 IndexedDB에 보관됩니다.</p><div class="bar"><label class="btn" style="cursor:pointer">📥 표지 이미지 일괄 업로드<input type="file" accept="image/*" multiple style="display:none" onchange="uploadCoverLibrary(this)"></label><input class="input" placeholder="표지 파일명 검색" value="${attr(coverLibrarySearch)}" oninput="coverLibrarySearch=this.value;drawCoverLibrary()"></div><div class="library-grid">${images.map(x=>`<div class="library-tile"><img src="${attr(libraryUrl(x))}" alt=""><div class="tiny">${esc(x.name)}</div><div class="actions"><button class="btn secondary" onclick="linkCoverLibrary('${x.id}')">책에 연결</button><button class="btn danger" onclick="deleteCoverLibrary('${x.id}')">삭제</button></div></div>`).join('')||'<p class="muted">등록된 표지가 없습니다.</p>'}</div></div>`}
function drawCoverLibrary(){let el=document.getElementById('coverLibraryContent');if(el)el.innerHTML=coverLibraryView()}
function openCoverLibrary(){document.getElementById('modalTitle').textContent='공용 표지 보관함';document.getElementById('modalBody').innerHTML='<div id="coverLibraryContent"></div>';drawCoverLibrary();modal.showModal()}
function linkCoverLibrary(libId){let x=coverLibraryItems.find(i=>i.id===libId);if(!x)return;let q=prompt('표지를 연결할 책의 제목 또는 저자 일부를 입력하세요.','');if(q===null)return;let matches=data.books.filter(b=>[b.title,b.author].some(v=>String(v||'').toLowerCase().includes(q.trim().toLowerCase())));if(!q.trim())matches=[];if(!matches.length){alert('일치하는 책이 없습니다.');return}document.getElementById('modalBody').innerHTML=`<p class="muted">표지: ${esc(x.name)} · 연결할 책을 선택하세요.</p><input class="input" id="libraryBookQuery" placeholder="책 제목 다시 검색" value="${attr(q)}" oninput="filterLibraryBookMatches(this.value)"><div id="libraryBookMatches"></div><button class="btn secondary" onclick="openCoverLibrary()">← 보관함으로</button>`;coverLibrarySelected=libId;filterLibraryBookMatches(q)}
function filterLibraryBookMatches(q){let matches=data.books.filter(b=>[b.title,b.author].some(v=>String(v||'').toLowerCase().includes(q.toLowerCase()))).slice(0,100);document.getElementById('libraryBookMatches').innerHTML=matches.map(b=>`<div class="item"><span>${esc(b.title)} <small class="muted">${esc(b.author||'')}</small></span><button class="btn" onclick="assignLibraryCover('${attr(b.id)}')">이 책에 연결</button></div>`).join('')||'<p class="muted">검색 결과 없음</p>'}
function assignLibraryCover(bookId){let b=data.books.find(x=>x.id===bookId),item=coverLibraryItems.find(x=>x.id===coverLibrarySelected);if(!b||!item)return;b.coverLibraryId=item.id;b.cover=libraryUrl(item);save();modal.close();render();alert('표지를 연결했습니다. 결산과 영수증에도 적용됩니다.')}
async function deleteCoverLibrary(libId){if(!confirm('보관함에서 이 이미지를 삭제할까요?'))return;await libraryDelete(libId);coverLibraryItems=coverLibraryItems.filter(x=>x.id!==libId);for(let b of data.books){if(b.coverLibraryId===libId){b.coverLibraryId='';b.cover=''}}save();drawCoverLibrary();render()}

applyPrefs();render();restoreLibraryCovers();
</script></body></html>
